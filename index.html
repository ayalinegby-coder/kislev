<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אור וחיות נפשנו ניתן לנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@900&display=swap">
<style>
/* Layout: the user's paper landscape is the page. Lanterns hang above its four stations, and a separate darkness layer is cut away by each lit lantern. */
:root {
  color-scheme: dark;
  --night: #0a0c18;
  --night-2: #151a36;
  --felt: #1c234b;
  --moss: #6f7c4e;
  --moss-deep: #39534e;
  --flame: #f0b23c;
  --gold: #c9973f;
  --paper: #f1e6cf;
  --paper-2: #dfcfae;
  --ink: #2a2433;
  --line: #59608a;
  --dim: #8a8fb0;
  --display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
  --dw: 900;
  --body: "Assistant", "Arial Hebrew", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body { background: var(--night); color: var(--paper); font-family: var(--body); font-size: 18px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--flame); outline-offset: 3px; }

/* ---------- Scene ---------- */
.scene { position: relative; width: min(100%, 177.78vh); min-width: 0; margin-inline: auto; container-type: inline-size; background: var(--night); }
.scroller { overflow: hidden; }
.stage { position: relative; width: 100%; aspect-ratio: 1672 / 941; container-type: inline-size; isolation: isolate; }
.stage > img, #dark { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#dark { pointer-events: none; z-index: 1; }

/* ---------- Arrow to the decisions board ---------- */
html { scroll-behavior: smooth; }
.to-board { position: absolute; z-index: 6; bottom: 1cqw; left: 50%; translate: -50% 0; display: flex; flex-direction: column; align-items: center; gap: .2em; color: var(--paper); text-decoration: none; font-weight: 600; font-size: max(14px, 1.15cqw); text-shadow: 0 1px 6px rgba(0, 0, 0, .9); animation: bob 2.4s ease-in-out infinite; }
.to-board svg { width: 1.6em; height: 1.6em; stroke: var(--flame); filter: drop-shadow(0 0 6px rgba(240, 178, 60, .6)); }
.to-board:hover { color: var(--flame); }
@keyframes bob { 50% { transform: translateY(.35em); } }

/* ---------- Decisions board: one floating lantern per class ---------- */
.decisions { position: relative; background: #000; min-height: 100vh; padding: 56px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); text-align: center; overflow: hidden; }
.decisions h2 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: clamp(34px, 5vw, 64px); line-height: 1.1; color: var(--flame); text-shadow: 0 0 18px rgba(240, 178, 60, .35); }
.board-sub { margin: 10px auto 0; max-width: 640px; color: var(--dim); }
.board-empty { margin: 48px auto 0; max-width: 520px; color: var(--paper-2); }
.sky { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; max-width: 1500px; margin: 36px auto 0; }
.float { position: relative; margin: 0; width: clamp(240px, 21vw, 300px); aspect-ratio: 1; animation: drift var(--t, 7s) ease-in-out var(--d, 0s) infinite; }
.float .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.float .ring text { fill: var(--paper); font-family: var(--body); font-weight: 600; }
.float .halo { position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .38), rgba(240, 178, 60, 0)); animation: flicker 2.3s ease-in-out infinite; }
.float img { position: absolute; left: 50%; top: 21%; height: 41%; translate: -50% 0; }
.float .name { position: absolute; left: 50%; top: 64%; translate: -50% 0; width: max-content; max-width: 58%; padding: .05em .7em .15em; background: var(--paper); color: var(--ink); border: 1px solid var(--paper-2); font-weight: 700; font-size: clamp(12px, 1vw, 15px); line-height: 1.25; transform: rotate(-1.2deg); }
.float.off .halo { display: none; }
.float.off img { filter: brightness(.55) saturate(.6); }
.float.off .name { background: var(--night-2); color: var(--paper-2); border-color: #333a5e; }
@keyframes drift { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-14px) rotate(1deg); } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .to-board, .float, .float .halo { animation: none; }
}

/* The two girls stand in the bottom-left corner above the darkness, so they are lit from the first visit. */
.friends { position: absolute; z-index: 2; left: 1.6cqw; bottom: 1.2cqw; width: 15.5cqw; height: 17cqw; pointer-events: none; }
.friends::before { content: ""; position: absolute; inset: -18% -30% -10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .26), rgba(240, 178, 60, .08) 60%, rgba(240, 178, 60, 0)); }
.friends img { position: absolute; bottom: 0; height: 100%; width: auto; filter: drop-shadow(0 .4cqw .6cqw rgba(0, 0, 0, .45)); }
.friends .girl-2 { left: 0; }
.friends .girl-1 { right: 0; }
.hand-glow { position: absolute; z-index: 1; left: -2.6cqw; top: 3.6cqw; width: 7.2cqw; height: 7.2cqw; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .55), rgba(240, 178, 60, 0)); animation: flicker 2.3s ease-in-out infinite; }
.friends .girl-2 { z-index: 2; }

.masthead { position: absolute; z-index: 5; top: 1.6cqw; right: 2cqw; width: 57cqw; pointer-events: none; text-align: center; display: grid; gap: .5cqw; }
.eyebrow { margin: 0; color: var(--dim); font-size: max(14px, 1.2cqw); font-weight: 600; }
.phrase { position: relative; margin: 0; aspect-ratio: 1600 / 257; }
.phrase img { position: absolute; inset: 0; width: 100%; height: 100%; }
.phrase .word-lit { opacity: 0; transition: opacity 1.6s ease; filter: drop-shadow(0 0 .7cqw rgba(240, 178, 60, .55)); }
.phrase .word-lit.lit { opacity: 1; }
.phrase .night-title { transition: opacity 2.5s ease; }
.phrase .day-title { opacity: 0; transition: opacity 2.5s ease; }
.eyebrow, .status, .picker { transition: color 2.5s ease; }
@media (min-width: 761px) {
  .scene.day .phrase .day-title { opacity: 1; }
  .scene.day .phrase .night-title, .scene.day .phrase .word-lit.lit { opacity: 0; transition-duration: 2.5s; }
  .scene.day .eyebrow, .scene.day .status, .scene.day .picker { color: #1c234b; }
}
.below { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; align-items: center; font-size: max(14px, 1.25cqw); }
.picker { display: inline-flex; align-items: center; gap: 8px; color: var(--paper-2); font-weight: 600; pointer-events: auto; }
.picker select { font: inherit; font-weight: 700; color: var(--paper); background: var(--night-2); border: 1px solid var(--line); padding: 2px 8px; }
.status { margin: 0; color: var(--dim); }

/* ---------- Lantern ---------- */
.lantern {
  position: absolute; z-index: 4; left: var(--x); top: var(--y); width: var(--w);
  transform: translateX(-50%); background: none; border: 0; padding: 0; display: block;
}
.lantern::before { content: ""; position: absolute; bottom: 100%; left: 50%; width: 1px; height: 4cqw; background: linear-gradient(to top, #8b8f9a, transparent); }
.lamp { position: relative; display: block; width: 100%; aspect-ratio: 380 / 643; transition: transform .35s ease; transform-origin: 50% 0; }
.lantern:hover .lamp { transform: rotate(-2deg); }
.lamp img { position: absolute; inset: 0; width: 100%; height: 100%; }
.lamp .off { filter: brightness(.6) saturate(.75); transition: filter .4s, opacity 1.4s; }
.lantern:hover .off { filter: brightness(.95) saturate(.9); }
.lamp .on { opacity: 0; transition: opacity 1.4s; }
.glow { position: absolute; inset: -32% -60%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .34), rgba(240, 178, 60, 0)); opacity: .3; animation: breathe 3.6s ease-in-out infinite; pointer-events: none; }
.lantern.locked .off, .lantern.locked:hover .off { filter: brightness(.34) saturate(.45); }
.lantern.locked .glow { display: none; }
.lantern.locked .tag { color: var(--dim); }
.lantern.lit .off { opacity: 0; }
.lantern.lit .on { opacity: 1; }
.lantern.lit .glow { opacity: 1; animation: flicker 2.3s ease-in-out infinite; }
.tag {
  position: absolute; top: calc(100% + .45cqw); left: 50%; translate: -50% 0;
  padding: .1em .8em .2em; width: max-content;
  background: var(--night-2); color: var(--paper-2); border: 1px solid #333a5e;
  font-weight: 600; font-size: max(13px, 1.05cqw); line-height: 1.25; text-align: center;
  transform: rotate(-1.2deg); transition: background 1.4s, color 1.4s, border-color 1.4s;
}
.tag b { display: block; font-family: var(--display); font-weight: var(--dw); font-size: 1.2em; }
.lantern.lit .tag { background: var(--paper); color: var(--ink); border-color: var(--paper-2); box-shadow: 0 3px 8px rgba(0, 0, 0, .4); }
@keyframes breathe { 50% { opacity: .65; } }
@keyframes flicker { 0%, 100% { opacity: 1; } 35% { opacity: .82; } 65% { opacity: .94; } }

/* ---------- Demo strip ---------- */
.strip {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center;
  background: var(--night-2); padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.strip p { margin: 0; color: var(--dim); font-size: 1rem; }
.btn { border: 0; padding: 9px 20px 10px; font-weight: 700; background: var(--flame); color: var(--ink); box-shadow: 0 3px 0 #9a6a26; transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(1px); box-shadow: 0 2px 0 #9a6a26; }
.btn:disabled { background: #d8cbae; color: #6d6252; box-shadow: none; cursor: default; transform: none; }
.btn.quiet { background: transparent; color: var(--paper-2); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.quiet:hover { box-shadow: inset 0 0 0 1.5px var(--paper-2); }

/* ---------- Book dialog ---------- */
dialog { border: 0; padding: 0; background: none; color: var(--ink); width: min(1000px, calc(100vw - 32px)); max-height: 92vh; overflow: visible; }
dialog::backdrop { background: rgba(5, 6, 14, .78); }
dialog[open] .book { animation: rise .7s cubic-bezier(.2, .9, .3, 1.05); transform-origin: 50% 100%; }
@keyframes rise { from { transform: perspective(1400px) rotateX(58deg) scale(.86); opacity: 0; } }
.book {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; max-height: 92vh; overflow: auto;
  background: var(--paper); border-bottom: 10px solid var(--moss-deep);
  box-shadow: 0 2px 0 var(--paper-2), 0 5px 0 #cdbb97, 0 30px 70px rgba(0, 0, 0, .7);
}
.page { padding: 30px 34px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.page:first-child { background: linear-gradient(to left, transparent 86%, rgba(90, 66, 30, .16)); }
.page:last-child { background: linear-gradient(to right, transparent 86%, rgba(90, 66, 30, .16)); }
.page h2, .page h3, .page p, .page ol { margin: 0; }
.date { color: #8a4a1f; font-weight: 700; }
.word { font-family: var(--display); font-weight: var(--dw); font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1.1; color: var(--felt); }
.page h3 { font-family: var(--display); font-weight: var(--dw); font-size: 1.3rem; color: var(--moss-deep); }
.slot { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; text-align: center; padding: 12px; background: #2b2d33; color: var(--paper-2); font-size: 1rem; }
.slot:has(video) { padding: 0; background: #000; }
.slot video { display: block; width: 100%; height: 100%; }
#dProgram { white-space: pre-line; }
.song-row[hidden] { display: none; }
.added { display: grid; gap: 6px; }
.added label { font-size: 1rem; color: #6d6252; }
.added textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; color: var(--ink); background: #f8f1e0; border: 1px dashed #8d7c5c; padding: 8px 10px; }
.saved { min-height: 1.3em; font-size: .9rem; color: var(--moss-deep); }
.note { font-size: .95rem; color: #6d6252; }
.steps { list-style: none; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: baseline; border-bottom: 1px dashed #c8b58f; padding-bottom: 8px; }
.steps time { color: #8a4a1f; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.book .btn.quiet { color: var(--ink); box-shadow: inset 0 0 0 1.5px #8d7c5c; }
.wait { width: min(420px, calc(100vw - 32px)); }
.wait-card { background: var(--paper); padding: 26px 28px; display: grid; gap: 12px; justify-items: start; box-shadow: 0 2px 0 var(--paper-2), 0 5px 0 #cdbb97, 0 30px 70px rgba(0, 0, 0, .7); }
.wait-card h2, .wait-card p { margin: 0; }
.wait-card h2 { font-family: var(--display); font-weight: var(--dw); font-size: 1.7rem; line-height: 1.2; color: var(--felt); }
.sim { display: inline-flex; align-items: center; gap: 8px; color: var(--paper-2); font-weight: 600; }
.sim input { font: inherit; color: var(--paper); background: var(--night); border: 1px solid var(--line); padding: 3px 8px; }
.close { position: absolute; top: 10px; left: 12px; z-index: 2; width: 40px; height: 40px; border: 0; background: none; color: var(--ink); font-size: 1.6rem; line-height: 1; }

/* ---------- Design language board ---------- */
.board { background: var(--night); padding-block: 56px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.board-in { max-width: 1040px; margin: 0 auto; display: grid; gap: 52px; }
.board h2 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.2; color: var(--flame); }
.board h3 { margin: 0 0 16px; font-family: var(--display); font-weight: var(--dw); font-size: 1.4rem; color: var(--paper); }
.lede { margin: 10px 0 0; max-width: 62ch; color: var(--paper-2); }
.logos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.logos figure { position: relative; margin: 0; min-width: 0; padding: 18px 18px 44px; display: grid; align-items: center; }
.logos .on-night { background: var(--felt); }
.logos .on-paper { background: var(--paper); }
.logos img { display: block; width: 100%; height: auto; }
.logos .on-paper img { max-width: 300px; margin-inline: auto; }
.logos figcaption { position: absolute; bottom: 10px; right: 18px; font-size: .95rem; color: var(--dim); }
.logos .on-paper figcaption { color: #6d6252; }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.sw { min-width: 0; }
.chip { height: 104px; background: var(--c); }
.sw b { display: block; margin-top: 8px; font-weight: 700; }
.sw span { display: block; color: var(--dim); font-size: .95rem; line-height: 1.35; }
.type { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.type > div { min-width: 0; }
.type .big { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: 2.5rem; line-height: 1.2; color: var(--paper); }
.type .txt { margin: 0; font-size: 1.15rem; color: var(--paper-2); max-width: 44ch; }
.cap { margin: 8px 0 0; color: var(--dim); font-size: .95rem; }
.parts { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-end; }
.parts figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
.parts figcaption { color: var(--dim); font-size: .95rem; }
.parts img { width: 84px; height: auto; display: block; }
.parts img.dimmed { filter: brightness(.6) saturate(.75); }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin: 0; padding: 0; list-style: none; }
.rules li { min-width: 0; color: var(--paper-2); }
.rules b { display: block; color: var(--paper); font-family: var(--display); font-weight: var(--dw); font-size: 1.2rem; margin-bottom: 4px; }

/* Narrow screens: the title sits above, and the path is walked sideways from 770 onward. */
@media (max-width: 760px) {
  body { font-size: 17px; }
  .scene { width: 100%; }
  .masthead { position: static; width: auto; gap: 8px; padding-block: 16px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .scroller { overflow-x: auto; overscroll-behavior-x: contain; }
  .stage { width: 1120px; }
  .book { grid-template-columns: 1fr; }
  .page { padding: 24px 20px; }
  .page:first-child, .page:last-child { background: none; }
  .slot { aspect-ratio: 21 / 9; }
  .swatches { grid-template-columns: repeat(3, 1fr); }
  .logos { grid-template-columns: 1fr; }
  .type, .rules { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .glow, .lantern.lit .glow, .hand-glow, dialog[open] .book { animation: none; }
  .lamp, .lamp img, .phrase span { transition: none; }
}
</style>
</head>
<body>
<div dir="rtl" lang="he">
  <section class="scene" id="scene" aria-label="לוח חודש כסלו">
    <header class="masthead">
      <p class="eyebrow">חודש כסלו · לוח הפעלה למורות</p>
      <h1 class="phrase" aria-label="אור וחיות נפשנו ניתן לנו">
        <img class="night-title" src="assets/title-dim.png" alt="">
        <img class="day-title" src="assets/title-navy.png" alt="">
        <img class="word-lit" id="w1" src="assets/title-w1.png" alt="">
        <img class="word-lit" id="w2" src="assets/title-w2.png" alt="">
        <img class="word-lit" id="w3" src="assets/title-w3.png" alt="">
        <img class="word-lit" id="w4" src="assets/title-w4.png" alt="">
      </h1>
      <div class="below">
        <label class="picker" for="cls">הלוח של <select id="cls"></select></label>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
    </header>
    <div class="scroller" id="scroller">
      <div class="stage" id="stage">
        <img src="assets/background.jpg" alt="נוף נייר בלילה: שביל עולה מ־770 והרוקדים, דרך ספר מאמרי אדמו״ר האמצעי והחופה, אל דיוקן אדמו״ר הזקן והכרכרה.">
        <img id="dayBg" src="assets/background-day.jpg" alt="" style="opacity:0">
        <canvas id="dark" aria-hidden="true"></canvas>
        <div class="friends" aria-hidden="true">
          <span class="hand-glow"></span>
          <img class="girl-2" src="assets/girl-2-lantern.webp" alt="">
          <img class="girl-1" src="assets/girl-1.webp" alt="">
        </div>
      </div>
    </div>
    <a class="to-board" href="#board">
      <span>גללו למסך ההחלטות של אור</span>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
    </a>
  </section>

  <section class="decisions" id="board" aria-labelledby="boardTitle">
    <h2 id="boardTitle">ההחלטות של אור</h2>
    <p class="board-sub" id="boardSub"></p>
    <div class="sky" id="sky"></div>
    <p class="board-empty" id="boardEmpty" hidden></p>
  </section>

  <dialog id="dlg" aria-labelledby="dWord">
    <div class="book">
      <button class="close" id="dClose" type="button" aria-label="סגירה">×</button>
      <div class="page">
        <p class="date" id="dDate"></p>
        <h2 class="word" id="dWord"></h2>
        <p id="dAbout"></p>
        <div class="slot" id="dSlot"></div>
        <div class="song-row"><button class="btn quiet" id="dSong" type="button"></button></div>
        <audio id="song" preload="none"></audio>
      </div>
      <div class="page">
        <h3>התוכנית להיום</h3>
        <p id="dProgram"></p>
        <div class="added">
          <h3>הוספנו באור</h3>
          <label for="dNote">ההחלטה הטובה של הכיתה להיום</label>
          <textarea id="dNote" maxlength="300"></textarea>
          <p class="saved" id="dSaved" aria-live="polite"></p>
        </div>
        <div class="actions">
          <button class="btn" id="dLight" type="button"></button>
          <button class="btn quiet" id="dLater" type="button">נחזור לזה אחר כך</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="wait" id="waitDlg" aria-labelledby="waitTitle">
    <div class="wait-card">
      <h2 id="waitTitle"></h2>
      <p id="waitText"></p>
      <button class="btn" id="waitOk" type="button">הבנתי</button>
    </div>
  </dialog>

</div>

<script>
(function () {
  // x/y place the lantern's top on the landscape, w its width; light is the centre and radius of the area it reveals. All are fractions of the image.
  // The address of the shared sheet's web app.
  var API = 'https://script.google.com/macros/s/AKfycbzplu_IajxMGmVkBeDsCiWHjhclrpPZoe9m6ZpGVcA7hpEvWTlE050480mQy4OmHykV/exec';
  var DAYS = [
