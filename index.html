<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אור וחיות נפשנו ניתן לנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@900&family=Gveret+Levin&display=swap">
<style>
/* Layout: the user's paper landscape is the page. Lanterns hang above its four stations, and a separate darkness layer is cut away by each lit lantern. */
:root {
  color-scheme: dark;
  --night: #0a0c18;
  --night-2: #151a36;
  --felt: #1c234b;
  --moss: #6f7c4e;
  --moss-deep: #39534e;
  --flame: #f0b23c;
  --gold: #c9973f;
  --paper: #f1e6cf;
  --paper-2: #dfcfae;
  --ink: #2a2433;
  --line: #59608a;
  --dim: #8a8fb0;
  --display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
  --dw: 900;
  --body: "Assistant", "Arial Hebrew", Arial, sans-serif;
  --hand: "Gveret Levin", "Assistant", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body { background: var(--night); color: var(--paper); font-family: var(--body); font-size: 18px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--flame); outline-offset: 3px; }

/* ---------- Scene ---------- */
.scene { position: relative; width: min(100%, 177.78vh); min-width: 0; margin-inline: auto; container-type: inline-size; background: var(--night); }
.scroller { overflow: hidden; }
.stage { position: relative; width: 100%; aspect-ratio: 1672 / 941; container-type: inline-size; isolation: isolate; }
.stage > img, #dark { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#dark { pointer-events: none; z-index: 1; }

/* ---------- Door to the preparation week ---------- */
/* A pop-up paper door between the ט׳–י׳ and י״ד lanterns; it swaps to the open picture before the week's screen appears. */
.door { position: absolute; z-index: 4; left: 50.5%; top: 54.1%; width: 5.6%; aspect-ratio: 368 / 420; transform: translateX(-50%); background: none; border: 0; padding: 0; transition: transform .35s ease; }
.door::before { content: ""; position: absolute; inset: -40% -80% -15%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .36), rgba(240, 178, 60, 0)); animation: breathe 3.6s ease-in-out infinite; pointer-events: none; transition: inset .8s ease, opacity .8s ease; }
.door img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 .3cqw .4cqw rgba(0, 0, 0, .45)); transition: opacity .5s ease, filter .4s; }
.door .d-open { opacity: 0; }
.door:hover { transform: translateX(-50%) translateY(-3%); }
.door.open .d-open { opacity: 1; }
.door.open .d-closed { opacity: 0; }
.door.open::before { inset: -150% -260% -80%; }
.door.locked img { filter: brightness(.55) saturate(.7) drop-shadow(0 .3cqw .4cqw rgba(0, 0, 0, .45)); }
.door.locked::before { opacity: .35; }
.door .tag b { font-size: 1.15em; }

/* ---------- Preparation week screen ---------- */
dialog.prep { width: 100vw; max-width: 100vw; height: 100%; max-height: 100%; margin: 0; inset: 0; overflow: auto; color: var(--paper); background: radial-gradient(ellipse at 50% -10%, #232a57 0%, var(--night) 62%); }
dialog.prep::backdrop { background: var(--night); }
dialog.prep[open] .prep-in { animation: dawn .9s ease both; }
@keyframes dawn { from { opacity: 0; transform: scale(.97); } }
.prep-in { position: relative; max-width: 1000px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 26px; }
.prep-close { justify-self: start; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; color: var(--paper-2); font-weight: 600; }
.prep-close:hover { color: var(--flame); }
.prep-head { text-align: center; display: grid; gap: 6px; }
.prep-head .eyebrow { margin: 0; color: var(--dim); font-weight: 600; font-size: 1rem; }
.prep-head h2 { outline: none; margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: clamp(38px, 6vw, 64px); line-height: 1.05; color: var(--flame); text-shadow: 0 0 18px rgba(240, 178, 60, .35); }
.prep-sub { margin: 0 auto; max-width: 560px; color: var(--paper-2); }
/* Jingle: a paper gramophone in the screen's top corner; it opens the dance clip under the title. */
.jingle { position: absolute; z-index: 2; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); width: 118px; aspect-ratio: 1; padding: 0; background: none; border: 0; transition: transform .35s ease; }
.jingle::before { content: ""; position: absolute; inset: -22%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .38), rgba(240, 178, 60, 0)); animation: breathe 3.6s ease-in-out infinite; pointer-events: none; }
.jingle img { position: relative; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); }
.jingle:hover, .jingle[aria-expanded="true"] { transform: translateY(-4px) rotate(-3deg); }
.jingle .tag { top: calc(100% + 2px); font-size: 15px; }
.jingle-player { width: min(100%, 760px); justify-self: center; display: grid; gap: 6px; }
.jingle-player[hidden] { display: none; }
.jingle-player .slot { border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 3px var(--flame), 0 0 34px rgba(240, 178, 60, .45), 0 24px 60px rgba(0, 0, 0, .6); }
@media (max-width: 640px) { .jingle { width: 84px; top: 10px; } .jingle .tag { font-size: 13px; } .prep-head { padding-top: 92px; } }

/* ---------- Pop-up book: opens when the door is clicked, one pop-up per day ---------- */
.popbook { container-type: inline-size; width: min(100%, 900px, 125vh); justify-self: center; }
.pb-stage { position: relative; margin-top: -8cqw; height: 50cqw; perspective: 150cqw; perspective-origin: 50% 10%; }
.pb-book { position: absolute; left: 11cqw; right: 11cqw; top: 3cqw; height: 52cqw; transform-style: preserve-3d; transform-origin: 50% 100%; transform: rotateX(46deg); }
.pb-glow { position: absolute; inset: -18% -10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .32), rgba(240, 178, 60, 0)); transform: translateZ(-2px); pointer-events: none; }
.pb-page { position: absolute; top: 0; bottom: 0; width: 50%; background: url(assets/book-open.webp) 0 0 / 200% 100% no-repeat; }
.pb-left { left: 0; filter: drop-shadow(-1cqw 2.4cqw 2.4cqw rgba(0, 0, 0, .55)); }
.pb-cover { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; transform-origin: 100% 50%; transform-style: preserve-3d; transform: rotateY(180deg); }
.pb-cover > div { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.pb-front { display: grid; place-content: end center; gap: .8cqw; padding-bottom: 30%; text-align: center; background: url(assets/book-cover.webp) center / 100% 100% no-repeat; border-radius: .6cqw; box-shadow: -1cqw 2.4cqw 3cqw rgba(0, 0, 0, .55); }
.pb-front b { font-family: var(--display); font-weight: var(--dw); font-size: 5cqw; line-height: 1; color: var(--flame); text-shadow: 0 .3cqw .6cqw rgba(0, 0, 0, .6), 0 0 2cqw rgba(240, 178, 60, .45); }
.pb-front span { font-family: var(--hand); font-size: 3cqw; color: var(--paper); text-shadow: 0 .2cqw .5cqw rgba(0, 0, 0, .6); }
.pb-back { transform: rotateY(180deg); background: url(assets/book-open.webp) 100% 0 / 200% 100% no-repeat; filter: drop-shadow(1cqw 2.4cqw 2.4cqw rgba(0, 0, 0, .55)); }
.pb-pops { position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(1px); }
.pop { position: absolute; width: 19%; padding: 0; background: none; border: 0; color: var(--ink); transform-origin: 50% 100%; transform: rotateX(-46deg); display: grid; justify-items: center; align-content: end; gap: .4cqw; }
.pop img { width: 100%; height: 15cqw; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 0 .25cqw #fff) drop-shadow(0 0 .25cqw #fff) drop-shadow(0 .8cqw .8cqw rgba(0, 0, 0, .35)); transition: filter .4s, transform .3s; }
.pop .pop-tag { display: grid; padding: .3cqw 1.2cqw .4cqw; background: #fffaf0; box-shadow: 0 .3cqw .6cqw rgba(0, 0, 0, .3); line-height: 1.1; white-space: nowrap; }
.pop .pop-tag b { font-family: var(--hand); font-weight: 400; font-size: max(11px, 2.3cqw); color: var(--felt); }
.pop .pop-tag small { font-size: max(10px, 1.7cqw); color: #8a4a1f; font-weight: 700; }
.pop:hover img, .pop:focus-visible img { transform: translateY(-.8cqw); }
.pop.locked { cursor: default; }
.pop.locked img { filter: drop-shadow(0 0 .25cqw #fff) grayscale(.85) brightness(.75); }
.pop.locked .pop-tag { background: #e6dccb; }
.pop.locked .pop-tag b { color: #6d6252; }
.pop[aria-current="true"] img { filter: drop-shadow(0 0 .25cqw #fff) drop-shadow(0 0 .25cqw #fff) drop-shadow(0 0 2.2cqw rgba(240, 178, 60, .95)); }
.pop[aria-current="true"] .pop-tag { background: #fff4d6; box-shadow: 0 0 0 .3cqw var(--flame), 0 .3cqw .6cqw rgba(0, 0, 0, .3); }
.pb-final { justify-self: center; margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; background: rgba(21, 26, 54, .8); border: 1px solid var(--line); color: var(--paper); font-weight: 600; }
.pb-final img { width: 22px; height: 34px; object-fit: contain; }
.pb-final:hover { border-color: var(--flame); color: var(--flame); }
.pb-final.locked img { filter: brightness(.45) saturate(.5); }

/* the opening sequence: the closed book slides to the centre, the cover turns, then the pop-ups rise one by one */
.popbook.play .pb-book { animation: pbSlide 1.5s cubic-bezier(.3, .7, .3, 1) both; }
.popbook.play .pb-cover { animation: pbCover 1.3s .45s cubic-bezier(.5, .05, .3, 1) both; }
.popbook.play .pb-glow { animation: pbFade 1.2s 1.2s both; }
.popbook.play .pop { animation: pbPop .9s cubic-bezier(.25, .8, .35, 1.25) both; animation-delay: calc(1.45s + var(--i) * .2s); }
.popbook.play ~ .pd, .popbook.play ~ .secret, .popbook.play ~ .pb-final { animation: pbFade .8s both; animation-delay: calc(1.8s + var(--n, 5) * .2s); }
@keyframes pbSlide { from { transform: translateX(22cqw) rotateX(46deg) scale(.86); } }
@keyframes pbCover { from { transform: rotateY(0deg); } }
@keyframes pbFade { from { opacity: 0; } }
@keyframes pbPop { 0% { transform: rotateX(0deg); opacity: 0; } 12% { opacity: 1; } 100% { transform: rotateX(-46deg); } }
@media (max-width: 560px) { .popbook { width: calc(100% + 24px); margin-inline: -12px; } .pop { width: 17%; } }


.pd-card { position: relative; background: var(--paper); color: var(--ink); padding: 26px 30px 30px; border-bottom: 10px solid var(--moss-deep); box-shadow: 0 2px 0 var(--paper-2), 0 5px 0 #cdbb97, 0 30px 70px rgba(0, 0, 0, .6); display: grid; gap: 18px; }
.pd-card > header { display: grid; gap: 2px; }
.pd-date { margin: 0; color: #8a4a1f; font-weight: 700; }
.pd-title { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: clamp(1.7rem, 3.4vw, 2.3rem); line-height: 1.15; color: var(--felt); }
.pd-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; counter-reset: step; }
.pd-step { counter-increment: step; display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; }
.pd-step::before { content: counter(step); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--felt); color: var(--paper); font-weight: 700; font-family: var(--display); }
.pd-step > div { display: grid; gap: 10px; min-width: 0; }
.pd-step h4 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--display); font-weight: var(--dw); font-size: 1.25rem; color: var(--moss-deep); }
.pd-step p { margin: 0; }
.pill { display: inline-block; padding: 1px 10px 2px; font-family: var(--body); font-size: .8rem; font-weight: 700; line-height: 1.5; border-radius: 99px; }
.pill.site { background: var(--felt); color: var(--paper); }
.pill.bk { background: var(--moss); color: #fff; }
.pill.kind { background: #ead9b6; color: #6b4a1e; }
.pd-q { font-weight: 600; }
.pd-vote { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pd-vote button { text-align: right; padding: 12px 14px; background: #fbf5e8; color: var(--ink); border: 2px solid #d9c7a0; font-weight: 600; line-height: 1.4; transition: border-color .2s, background .2s; }
.pd-vote button:hover { border-color: var(--gold); }
.pd-vote button[aria-pressed="true"] { background: #fff4d6; border-color: var(--flame); box-shadow: inset 0 0 0 1px var(--flame); }
.pd-vote b { display: block; font-family: var(--display); font-weight: var(--dw); color: #8a4a1f; }
.pd-tally { color: #5d5470; font-size: .95rem; }
.pd-locked { padding: 14px; background: #efe4cc; color: #6d6252; text-align: center; }
.pd-key { padding: 10px 14px; background: #fff4d6; border-inline-start: 4px solid var(--flame); }

.secret { background: rgba(21, 26, 54, .75); border: 1px solid #333a5e; padding: 26px 24px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.secret h3 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: 1.7rem; color: var(--flame); }
.secret p { margin: 0; max-width: 560px; color: var(--paper-2); }
.code { display: flex; flex-direction: row; gap: 10px; direction: rtl; }
.code input { width: 52px; height: 60px; text-align: center; font-family: var(--hand); font-size: 2rem; background: var(--paper); color: var(--ink); border: 2px solid #d9c7a0; }
.code input:focus { border-color: var(--flame); outline: none; }
.code.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.secret-msg { min-height: 1.6em; }
.reveal { display: grid; gap: 10px; justify-items: center; animation: dawn 1.2s ease both; }
.reveal img { width: 90px; filter: drop-shadow(0 0 22px rgba(240, 178, 60, .8)); }
.reveal strong { font-family: var(--display); font-weight: var(--dw); font-size: clamp(2.6rem, 8vw, 4rem); line-height: 1; color: var(--flame); text-shadow: 0 0 26px rgba(240, 178, 60, .6); }

@media (max-width: 760px) {
  .pd-card { padding: 20px 16px 24px; }
  .pd-vote { grid-template-columns: 1fr; }
  .pd-step { grid-template-columns: 30px 1fr; gap: 10px; }
  .pd-step::before { width: 28px; height: 28px; }
  .code input { width: 44px; height: 54px; }
}
@media (prefers-reduced-motion: reduce) {
  .door, .door img, .door::before { transition: none; animation: none; }
  dialog.prep[open] .prep-in, .reveal, .code.shake { animation: none; }
  .popbook.play .pb-book, .popbook.play .pb-cover, .popbook.play .pb-glow, .popbook.play .pop, .popbook.play ~ * { animation: none; }
}

/* ---------- Arrow to the decisions board ---------- */
html { scroll-behavior: smooth; }
.to-board { position: absolute; z-index: 6; bottom: 1cqw; left: 50%; translate: -50% 0; display: flex; flex-direction: column; align-items: center; gap: .2em; color: var(--paper); text-decoration: none; font-family: var(--hand); font-weight: 400; font-size: max(17px, 1.45cqw); text-shadow: 0 1px 6px rgba(0, 0, 0, .9); animation: bob 2.4s ease-in-out infinite; }
.to-board svg { width: 1.6em; height: 1.6em; stroke: var(--flame); filter: drop-shadow(0 0 6px rgba(240, 178, 60, .6)); }
.to-board:hover { color: var(--flame); }
@keyframes bob { 50% { transform: translateY(.35em); } }

/* ---------- Decisions board: one floating lantern per class ---------- */
.decisions { position: relative; background: #000; min-height: 100vh; padding: 56px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); text-align: center; overflow: hidden; }
.decisions h2 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: clamp(34px, 5vw, 64px); line-height: 1.1; color: var(--flame); text-shadow: 0 0 18px rgba(240, 178, 60, .35); }
.board-sub { margin: 10px auto 0; max-width: 640px; color: var(--dim); }
.board-empty { margin: 48px auto 0; max-width: 520px; color: var(--paper-2); }
.sky { position: relative; max-width: 1500px; margin: 36px auto 0; }
.float { position: absolute; margin: 0; width: var(--s, 260px); aspect-ratio: 1; animation: drift var(--t, 7s) ease-in-out var(--d, 0s) infinite; }
.float .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.float .ring text { fill: var(--paper); font-family: var(--hand); font-weight: 400; }
.float .halo { position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .38), rgba(240, 178, 60, 0)); animation: flicker 2.3s ease-in-out infinite; }
.float img { position: absolute; left: 50%; top: 21%; height: 41%; translate: -50% 0; }
.float .name { position: absolute; left: 50%; top: 64%; translate: -50% 0; width: max-content; max-width: 58%; padding: .05em .7em .15em; background: var(--paper); color: var(--ink); border: 1px solid var(--paper-2); font-weight: 700; font-size: clamp(12px, 1vw, 15px); line-height: 1.25; transform: rotate(-1.2deg); }
.float.off .halo { display: none; }
.float.off img { filter: brightness(.55) saturate(.6); }
.float.off .name { background: var(--night-2); color: var(--paper-2); border-color: #333a5e; }
@keyframes drift { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-14px) rotate(1deg); } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .to-board, .float, .float .halo { animation: none; }
}

/* The two girls stand in the bottom-left corner above the darkness, so they are lit from the first visit. */
.friends { position: absolute; z-index: 2; left: 1.6cqw; bottom: 1.2cqw; width: 15.5cqw; height: 17cqw; pointer-events: none; }
.friends::before { content: ""; position: absolute; inset: -18% -30% -10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .26), rgba(240, 178, 60, .08) 60%, rgba(240, 178, 60, 0)); }
.friends img { position: absolute; bottom: 0; height: 100%; width: auto; filter: drop-shadow(0 .4cqw .6cqw rgba(0, 0, 0, .45)); }
.friends .girl-2 { left: 0; }
.friends .girl-1 { right: 0; }
.hand-glow { position: absolute; z-index: 1; left: -2.6cqw; top: 3.6cqw; width: 7.2cqw; height: 7.2cqw; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .55), rgba(240, 178, 60, 0)); animation: flicker 2.3s ease-in-out infinite; }
.friends .girl-2 { z-index: 2; }

.school-logo { position: absolute; z-index: 6; top: 1.6cqw; left: 2cqw; width: 15cqw; margin: 0; line-height: 0; }
.school-logo img { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 2px rgba(255, 255, 255, .95)) drop-shadow(0 0 5px rgba(255, 255, 255, .8)) drop-shadow(0 0 14px rgba(241, 230, 207, .55)); }
.masthead { position: absolute; z-index: 5; top: 1.6cqw; right: 2cqw; width: 57cqw; pointer-events: none; text-align: center; display: grid; gap: .5cqw; }
.eyebrow { margin: 0; color: var(--dim); font-size: max(14px, 1.2cqw); font-weight: 600; }
.phrase { position: relative; margin: 0; aspect-ratio: 1600 / 257; }
.phrase img { position: absolute; inset: 0; width: 100%; height: 100%; }
.phrase .word-lit { opacity: 0; transition: opacity 1.6s ease; filter: drop-shadow(0 0 .7cqw rgba(240, 178, 60, .55)); }
.phrase .word-lit.lit { opacity: 1; }
.phrase .night-title { transition: opacity 2.5s ease; }
.phrase .day-title { opacity: 0; transition: opacity 2.5s ease; }
.eyebrow, .status, .picker { transition: color 2.5s ease; }
@media (min-width: 761px) {
  .scene.day .phrase .day-title { opacity: 1; }
  .scene.day .phrase .night-title, .scene.day .phrase .word-lit.lit { opacity: 0; transition-duration: 2.5s; }
  .scene.day .eyebrow, .scene.day .status, .scene.day .picker { color: #1c234b; }
}
.below { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; align-items: center; font-size: max(14px, 1.25cqw); }
.picker { display: inline-flex; align-items: center; gap: 8px; color: var(--paper-2); font-weight: 600; pointer-events: auto; }
.picker select { font: inherit; font-weight: 700; color: var(--paper); background: var(--night-2); border: 1px solid var(--line); padding: 2px 8px; }
.status { margin: 0; color: var(--dim); }

/* ---------- Lantern ---------- */
.lantern {
  position: absolute; z-index: 4; left: var(--x); top: var(--y); width: var(--w);
  transform: translateX(-50%); background: none; border: 0; padding: 0; display: block;
}
.lantern::before { content: ""; position: absolute; bottom: 100%; left: 50%; width: 1px; height: 4cqw; background: linear-gradient(to top, #8b8f9a, transparent); }
.lamp { position: relative; display: block; width: 100%; aspect-ratio: 380 / 643; transition: transform .35s ease; transform-origin: 50% 0; }
.lantern:hover .lamp { transform: rotate(-2deg); }
.lamp img { position: absolute; inset: 0; width: 100%; height: 100%; }
.lamp .off { filter: brightness(.6) saturate(.75); transition: filter .4s, opacity 1.4s; }
.lantern:hover .off { filter: brightness(.95) saturate(.9); }
.lamp .on { opacity: 0; transition: opacity 1.4s; }
.glow { position: absolute; inset: -32% -60%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240, 178, 60, .34), rgba(240, 178, 60, 0)); opacity: .3; animation: breathe 3.6s ease-in-out infinite; pointer-events: none; }

.lantern.locked .glow { display: none; }
.lantern.locked .tag { color: var(--dim); }
.lantern.lit .off { opacity: 0; }
.lantern.lit .on { opacity: 1; }
.lantern.lit .glow { opacity: 1; animation: flicker 2.3s ease-in-out infinite; }
.tag {
  position: absolute; top: calc(100% + .45cqw); left: 50%; translate: -50% 0;
  padding: .1em .8em .2em; width: max-content;

  font-family: var(--hand); font-weight: 400; font-size: max(14px, 1.15cqw); line-height: 1.3; text-align: center;
  transform: rotate(-1.2deg); transition: background 1.4s, color 1.4s, border-color 1.4s;

.tag b { display: block; font-family: var(--hand); font-weight: 400; font-size: 1.3em; }
.lantern.lit .tag { background: var(--paper); color: var(--ink); border-color: var(--paper-2); box-shadow: 0 3px 8px rgba(0, 0, 0, .4); }
@keyframes breathe { 50% { opacity: .65; } }
@keyframes flicker { 0%, 100% { opacity: 1; } 35% { opacity: .82; } 65% { opacity: .94; } }

/* ---------- Demo strip ---------- */
.strip {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center;
  background: var(--night-2); padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.strip p { margin: 0; color: var(--dim); font-size: 1rem; }
.btn { border: 0; padding: 9px 20px 10px; font-weight: 700; background: var(--flame); color: var(--ink); box-shadow: 0 3px 0 #9a6a26; transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(1px); box-shadow: 0 2px 0 #9a6a26; }
.btn:disabled { background: #d8cbae; color: #6d6252; box-shadow: none; cursor: default; transform: none; }
a.btn { display: inline-block; text-decoration: none; }
.quiz-row { margin: 4px 0 14px; }
.btn.quiet { background: transparent; color: var(--paper-2); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.quiet:hover { box-shadow: inset 0 0 0 1.5px var(--paper-2); }

/* ---------- Book dialog ---------- */
dialog { border: 0; padding: 0; background: none; color: var(--ink); width: min(1000px, calc(100vw - 32px)); max-height: 92vh; overflow: visible; }
dialog::backdrop { background: rgba(5, 6, 14, .78); }
dialog[open] .book { animation: rise .7s cubic-bezier(.2, .9, .3, 1.05); transform-origin: 50% 100%; }
@keyframes rise { from { transform: perspective(1400px) rotateX(58deg) scale(.86); opacity: 0; } }
.book {

}
.page { padding: 30px 34px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.page:first-child { background: linear-gradient(to left, transparent 86%, rgba(90, 66, 30, .16)); }
.page:last-child { background: linear-gradient(to right, transparent 86%, rgba(90, 66, 30, .16)); }
.page h2, .page h3, .page p, .page ol { margin: 0; }
.date { color: #8a4a1f; font-weight: 700; }
.word { font-family: var(--display); font-weight: var(--dw); font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1.1; color: var(--felt); }
.page h3 { font-family: var(--display); font-weight: var(--dw); font-size: 1.3rem; color: var(--moss-deep); }
.slot { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; text-align: center; padding: 12px; background: #2b2d33; color: var(--paper-2); font-size: 1rem; }
.slot:has(video), .slot:has(iframe) { padding: 0; background: #000; }
.slot video, .slot iframe { display: block; width: 100%; height: 100%; border: 0; }
.slot:has(iframe) { aspect-ratio: 16 / 9; }
.slides-link { margin: 6px 0 0; font-size: .95rem; }
#dProgram { white-space: pre-line; }
.song-row[hidden] { display: none; }
.added { display: grid; gap: 6px; }
.added label { font-size: 1rem; color: #6d6252; }
.added textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; color: var(--ink); background: #f8f1e0; border: 1px dashed #8d7c5c; padding: 8px 10px; }
.saved { min-height: 1.3em; font-size: .9rem; color: var(--moss-deep); }
.note { font-size: .95rem; color: #6d6252; }
.steps { list-style: none; padding: 0; display: grid; gap: 10px; }

.steps time { color: #8a4a1f; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }

.close { position: absolute; top: 10px; left: 12px; z-index: 2; width: 40px; height: 40px; border: 0; background: none; color: var(--ink); font-size: 1.6rem; line-height: 1; }

/* ---------- Design language board ---------- */
.board { background: var(--night); padding-block: 56px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.parts figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
.parts figcaption { color: var(--dim); font-size: .95rem; }
.parts img { width: 84px; height: auto; display: block; }
.parts img.dimmed { filter: brightness(.6) saturate(.75); }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin: 0; padding: 0; list-style: none; }
.rules li { min-width: 0; color: var(--paper-2); }

/* Narrow screens: the title sits above, and the path is walked sideways from 770 onward. */
@media (max-width: 760px) {

      task: 'בוחרות מצווה אחת שקשה לנו ומקבלות אותה על עצמנו. היא תהיה ההחלטה הטובה שלנו לי״ט כסלו.', kind: 'משימה אישית' }
  ];
  var SECRET = 'לחיים', SECRET_FROM = PREP[4].date;
  var door = document.getElementById('door'), prepDlg = document.getElementById('prepDlg'), trail = document.getElementById('trail');
  var prepDayEl = document.getElementById('prepDay'), secretEl = document.getElementById('secret'), prepCur = -1, prepSig = '';
  function prepOpenDay(p) { return allOpen || today() >= p.date; }
  function prepStarted() { return prepOpenDay(PREP[0]); }
  function prepState(id) { return classState(id || classId) || {}; }
  function setPrep(kind, i, v) {
    var st = JSON.parse(JSON.stringify(prepState())), votes = (st.votes || []).slice();
    while (votes.length < 5) votes.push('');
    if (kind === 'vote') votes[i] = v; else st.secret = true;
    st.votes = votes;
    storePrep(st, kind === 'vote' ? { c: classId, p: i, vote: v } : { c: classId, secret: true }, classId + '|' + (kind === 'vote' ? 'p' + i : 'secret'));
  }
  function slot(file, empty) { return file ? '<div class="slot"><video controls preload="metadata" playsinline src="assets/' + esc(file) + '"></video></div>' : '<div class="slot">' + empty + '</div>'; }
  // The pop-ups are built once per opening (so their rise plays once); renderTrail only updates their state.
  var popbook = document.getElementById('popbook'), pbFinal = document.getElementById('pbFinal');
  function buildBook() {
    trail.textContent = '';
    var n = PREP.length;
    PREP.forEach(function (p, i) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'pop';
      // day 1 on the right; alternate back and front rows so the pop-ups don't hide each other
      b.style.right = (3 + i * (78 / Math.max(1, n - 1))) + '%';
      b.style.bottom = (i % 2 ? 44 : 20) + '%';
      b.style.setProperty('--i', i);
      b.innerHTML = '<img src="assets/' + esc(p.pop) + '" alt=""><span class="pop-tag"><b>' + p.day + '</b><small>' + p.dateText + '</small></span>';
      b.addEventListener('click', function () {
        if (!prepOpenDay(p)) return;
        prepCur = i; renderPrep();
        prepDayEl.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
      });
      trail.appendChild(b);
    });
    popbook.style.setProperty('--n', n); prepDlg.style.setProperty('--n', n);
    popbook.classList.remove('play'); void popbook.offsetWidth; popbook.classList.add('play');
  }
  function renderTrail() {
    [].forEach.call(trail.children, function (b, i) {
      var p = PREP[i], open = prepOpenDay(p);
      b.classList.toggle('locked', !open);
      b.setAttribute('aria-current', i === prepCur ? 'true' : 'false');
      b.setAttribute('aria-label', p.day + ', ' + p.dateText + ': ' + (open ? p.theme : 'נפתח ב' + p.dateText));
    });
    pbFinal.className = 'pb-final' + (DAYS[3].lit ? '' : ' locked');
    pbFinal.innerHTML = '<img src="assets/' + (DAYS[3].lit ? 'lantern-on.png' : 'lantern-off.png') + '" alt="">י״ט כסלו · ראש השנה לחסידות ←';
  }
  pbFinal.addEventListener('click', function () { prepDlg.close(); openDay(3); });
  function tally(i) {
    var n = [0, 0];
    CLASSES.forEach(function (c) { var v = (prepState(c.id).votes || [])[i]; if (v === 'א') n[0]++; else if (v === 'ב') n[1]++; });
    return n;
  }
  function cnt(n) { return n === 1 ? 'כיתה אחת' : n + ' כיתות'; }
  function renderPrep() {
    renderTrail();
    var p = PREP[prepCur]; if (!p) { prepDayEl.textContent = ''; return; }
    var mine = (prepState().votes || [])[prepCur] || '', n = tally(prepCur);
    prepDayEl.innerHTML = '<article class="pd-card"><header><p class="pd-date">' + p.day + ' · ' + p.dateText + '</p><h3 class="pd-title">' + esc(p.theme) + '</h3></header><ol class="pd-steps">' +
      '<li class="pd-step"><div><h4>הדילמה <span class="pill site">באתר</span></h4>' + slot(p.dilemma, 'כאן ייכנס סרטון הדילמה') + '<p class="pd-q">' + esc(p.question) + '</p></div></li>' +
      '<li class="pd-step"><div><h4>עכשיו לחוברת <span class="pill bk">בחוברת</span></h4><p>פותחות את החוברת ב' + p.day + ': ' + esc(p.book) + '</p><p class="pd-key">האות המאירה של היום מתחבאת בסרטון הדילמה. מצאתן? כתבו אותה במשבצת ״האות המאירה שמצאנו היום״ בחוברת.</p></div></li>' +
      '<li class="pd-step"><div><h4>מה קרה בסוף? <span class="pill site">באתר</span></h4>' + slot(p.ending, 'כאן ייכנס סרטון ההמשך') + '</div></li>' +
      '<li class="pd-step"><div><h4>המשימה <span class="pill kind">' + esc(p.kind) + '</span></h4><p>' + esc(p.task) + '</p></div></li>' +
      '</ol></article>';
    renderSecret();
  }
  function renderSecret() {
    var solved = !!prepState().secret, ready = allOpen || today() >= SECRET_FROM;
    if (solved) {
      secretEl.innerHTML = '<div class="reveal"><img src="assets/lantern-on.png" alt=""><strong>לחיים!</strong><p>גיליתן את המילה הסודית. ביום י״ט כסלו יצא אדמו״ר הזקן לחופשי ממאסרו, ומאז מברכים זה את זה: ״לחיים! לשנה טובה בלימוד החסידות ובדרכי החסידות״. נתראה בחג!</p></div>';
      return;
    }
    secretEl.innerHTML = '<h3 id="secretTitle">המילה הסודית</h3><p>בכל יום מתחבאת בסרטון הדילמה אות מאירה אחת. ' + (ready ? 'כתבו כאן את חמש האותיות לפי סדר הימים:' : 'ב' + PREP[4].day + ', ' + PREP[4].dateText + ', תוכלו לכתוב כאן את חמש האותיות ולגלות את המילה.') + '</p>' +
      (ready ? '<div class="code" id="code">' + [0, 1, 2, 3, 4].map(function (k) { return '<input maxlength="1" inputmode="text" autocomplete="off" aria-label="אות ' + (k + 1) + '">'; }).join('') + '</div><button class="btn" id="codeGo" type="button">לפתוח</button><p class="secret-msg" id="codeMsg" aria-live="polite"></p>' : '');
    if (!ready) return;
    var ins = [].slice.call(secretEl.querySelectorAll('.code input')), code = document.getElementById('code'), msg = document.getElementById('codeMsg');
    ins.forEach(function (inp, k) {
      inp.addEventListener('input', function () { inp.value = inp.value.trim().slice(-1); if (inp.value && ins[k + 1]) ins[k + 1].focus(); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Backspace' && !inp.value && ins[k - 1]) ins[k - 1].focus(); if (e.key === 'Enter') go(); });
    });
    function go() {
      var plain = function (t) { return t.replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ'); };
      var w = plain(ins.map(function (i) { return i.value; }).join(''));
      if (w === plain(SECRET)) { setPrep('secret'); renderSecret(); return; }
      msg.textContent = 'כמעט! בדקו שוב את האותיות בחוברת.';
      code.classList.remove('shake'); void code.offsetWidth; code.classList.add('shake');
    }
    document.getElementById('codeGo').addEventListener('click', go);
  }
  function openPrep() {
    if (prepCur < 0 || !prepOpenDay(PREP[prepCur])) { prepCur = -1; PREP.forEach(function (p, i) { if (prepOpenDay(p)) prepCur = i; }); if (allOpen) prepCur = 0; }
    buildBook(); renderPrep(); prepDlg.showModal(); prepDlg.scrollTop = 0;
  }
  function refreshDoor() {
    door.classList.toggle('locked', !prepStarted());
    door.setAttribute('aria-label', 'שבוע ההכנה לי״ט כסלו' + (prepStarted() ? '. פתיחה' : ', נפתח ביום ראשון, י״ב כסלו'));
  }
  door.addEventListener('click', function () {
    if (!prepStarted()) {
      document.getElementById('waitTitle').textContent = 'הדלת עוד סגורה';
      document.getElementById('waitText').textContent = 'שבוע ההכנה לי״ט כסלו ייפתח ביום ראשון, י״ב כסלו.';
      waitDlg.showModal(); return;
    }
    door.classList.add('open');
    setTimeout(openPrep, reduced ? 0 : 850);
  });
  prepDlg.addEventListener('close', function () { door.classList.remove('open'); [].forEach.call(prepDlg.querySelectorAll('video'), function (v) { v.pause(); }); });
  document.getElementById('prepClose').addEventListener('click', function () { prepDlg.close(); });
  // The jingle opens under the title and starts playing; a second press closes it.
  var jingleBtn = document.getElementById('jingleBtn'), jinglePlayer = document.getElementById('jinglePlayer'), jingleVid = jinglePlayer.querySelector('video');
  jingleBtn.addEventListener('click', function () {
    var show = jinglePlayer.hidden;
    jinglePlayer.hidden = !show; jingleBtn.setAttribute('aria-expanded', show ? 'true' : 'false');
    if (show) { jinglePlayer.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }); var pr = jingleVid.play(); if (pr && pr.catch) pr.catch(function () {}); }
    else jingleVid.pause();
  });
  // Votes from other classes arrive with the regular sync; redraw only when something changed.
  setInterval(function () {
    refreshDoor();
    if (!prepDlg.open) return;
    var sig = classId + JSON.stringify(CLASSES.map(function (c) { var s = prepState(c.id); return [s.votes, s.secret]; }));
    if (sig !== prepSig) { prepSig = sig; if (!prepDayEl.contains(document.activeElement) && !secretEl.contains(document.activeElement)) renderPrep(); }
  }, 3000);
  refreshDoor();

  function storePrep(st, item, key) { keepLocal(classId, st); pending[key] = item; changes++; keepPending(); send(); }

  layout(); apply(readLocal(), true); renderBoard(); send(); pull(true);
  var rt; new ResizeObserver(function () { clearTimeout(rt); rt = setTimeout(layout, 120); }).observe(stage);
  setInterval(function () { if (!document.hidden) pull(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
  requestAnimationFrame(loop);
})();
</script>
