<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>להורים · שבוע ההכנה לי״ט כסלו</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Frank+Ruhl+Libre:wght@900&display=swap">
<style>
:root { --night: #0a0c18; --flame: #f0b23c; --paper: #f1e6cf; --dim: #8a8fb0; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center; background: radial-gradient(ellipse at 50% -10%, #232a57 0%, var(--night) 62%); color: var(--paper); font: 18px/1.6 "Assistant", Arial, sans-serif; }
main { max-width: 460px; display: grid; gap: 14px; justify-items: center; }
img { width: 80px; filter: drop-shadow(0 0 22px rgba(240, 178, 60, .8)); }
h1 { margin: 0; font: 900 clamp(32px, 9vw, 48px)/1.1 "Frank Ruhl Libre", Georgia, serif; color: var(--flame); }
p { margin: 0; }
.small { color: var(--dim); font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="../assets/lantern-on.png" alt="">
  <h1>הורים יקרים</h1>
  <p>כאן תוכלו לראות בכל יום מה למדנו בשבוע ההכנה לי״ט כסלו, ולדווח על ביצוע המשימה.</p>
  <p class="small">העמוד ייפתח ביום ראשון, י״ב כסלו.</p>
</main>
</body>
</html>
