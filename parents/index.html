<style>
:root {
  color-scheme: dark;
  --night: #0a0c18;
  --felt: #1c234b;
  --moss-deep: #39534e;
  --flame: #f0b23c;
  --gold: #c9973f;
  --paper: #f1e6cf;
  --paper-2: #dfcfae;
  --ink: #2a2433;
  --line: #59608a;
  --dim: #8a8fb0;
  --display: "Suez One", "Frank Ruhl Libre", Georgia, serif;
  --dw: 400;
  --body: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --hand: "Gveret Levin", "Rubik", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% -10%, #232a57 0%, var(--night) 62%) fixed; color: var(--paper); font-family: var(--body); font-size: 18px; line-height: 1.6; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--flame); outline-offset: 3px; }
main { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
#app { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
#app[hidden] { display: none; }

.logos { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: -6px; }
.campaign-logo { margin: 0; width: 150px; line-height: 0; }
.campaign-logo img { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 2px rgba(255, 255, 255, .95)) drop-shadow(0 0 5px rgba(255, 255, 255, .8)) drop-shadow(0 0 14px rgba(241, 230, 207, .55)); }
.school-logo { margin: 0; width: 132px; line-height: 0; }
.school-logo img { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 2px rgba(255, 255, 255, .95)) drop-shadow(0 0 5px rgba(255, 255, 255, .8)) drop-shadow(0 0 14px rgba(241, 230, 207, .55)); }
.head { text-align: center; display: grid; gap: 4px; justify-items: center; }
.head img { width: 64px; filter: drop-shadow(0 0 20px rgba(240, 178, 60, .75)); }
.head .eyebrow { margin: 0; color: var(--dim); font-weight: 600; font-size: .95rem; }
.head h1 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: clamp(32px, 8vw, 46px); line-height: 1.1; color: var(--flame); text-shadow: 0 0 18px rgba(240, 178, 60, .35); }
.head p { margin: 0; color: var(--paper-2); }
.who { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 10px; color: var(--paper-2); font-size: .95rem; }
.who b { color: var(--paper); }
.link { background: none; border: 0; padding: 0; color: var(--flame); text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; }

.card { position: relative; background: var(--paper); color: var(--ink); padding: 24px 22px 26px; border-bottom: 10px solid var(--moss-deep); box-shadow: 0 2px 0 var(--paper-2), 0 5px 0 #cdbb97, 0 30px 70px rgba(0, 0, 0, .6); display: grid; gap: 16px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: 1.6rem; line-height: 1.2; color: var(--felt); }
.card p { margin: 0; }
label { display: grid; gap: 4px; font-weight: 600; }
input, textarea { width: 100%; padding: 10px 12px; background: #fffaf0; color: var(--ink); border: 2px solid #d9c7a0; border-radius: 0; }
input:focus, textarea:focus { border-color: var(--flame); outline: none; }
.btn { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; background: var(--felt); color: var(--paper); border: 0; font-weight: 700; }
.btn:hover { background: #2a3366; }
.btn[disabled] { opacity: .6; cursor: default; }
.msg { min-height: 1.4em; color: #9a3412; font-weight: 600; }

.days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.days button { flex: 0 0 auto; display: grid; justify-items: center; gap: 2px; width: 84px; padding: 8px 4px; background: rgba(21, 26, 54, .75); border: 1px solid #333a5e; color: var(--paper-2); }
.days img { width: 46px; height: 42px; object-fit: contain; }
.days b { font-family: var(--hand); font-weight: 400; font-size: 1.05rem; line-height: 1; color: var(--paper); }
.days small { font-size: .78rem; }
.days button[aria-current="true"] { border-color: var(--flame); box-shadow: inset 0 0 0 1px var(--flame); }
.days button[aria-current="true"] small { color: var(--flame); }
.days button[disabled] { opacity: .45; cursor: default; }
.days button .tick { color: #7fc48a; font-weight: 700; }

.day-top { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.day-top img { width: 84px; height: 78px; object-fit: contain; }
.date { margin: 0; color: #8a4a1f; font-weight: 700; }
.sec { display: grid; gap: 6px; }
.sec h3 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: 1.15rem; color: var(--moss-deep); }
.quote { padding: 12px 14px; background: #fde9d2; border-inline-start: 4px solid #f0bf73; font-weight: 600; }
.quote small { display: block; font-weight: 400; color: #6d6252; }
.talk { padding: 12px 14px; background: #fff4d6; border-inline-start: 4px solid var(--flame); }
.task { padding: 14px; background: #eef1fa; border-inline-start: 4px solid var(--felt); }
.task ul { margin: 6px 0 0; padding-inline-start: 20px; }
.todo { display: grid; gap: 10px; }
.pic { margin: 0; display: grid; gap: 6px; }
.pic img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border: 4px solid #fffaf0; box-shadow: 0 0 0 1px #d9c7a0, 0 10px 24px rgba(42, 36, 51, .25); }
.pic figcaption { color: #6d6252; font-size: .9rem; text-align: center; }
.todo p { margin: 0; font-weight: 600; }
.todo textarea { min-height: 70px; }

.report { display: grid; gap: 10px; padding-top: 6px; border-top: 2px dashed #d9c7a0; }
.report h3 { margin: 0; font-family: var(--display); font-weight: var(--dw); font-size: 1.15rem; color: var(--felt); }
.done { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 16px; background: #edf6ee; border: 2px solid #9cc9a3; }
/* ===== Livelier day card (2026-11-23), same language as the teachers' site ===== */
#day { --c: #ef8a3c; --c-d: #b85d1c; border-radius: 22px; overflow: hidden; padding: 0 0 24px; gap: 16px; border-bottom: 0;
  background: radial-gradient(circle at 12px 12px, rgba(201, 151, 63, .16) 2px, transparent 2.5px) 0 0 / 26px 26px, var(--paper);
  box-shadow: 0 6px 0 var(--c-d), 0 30px 70px rgba(0, 0, 0, .6); }
#day > * { margin-inline: 16px; }
#day > .day-top { position: relative; margin: 0; padding: 20px 18px 28px; color: #fff;
  background: radial-gradient(circle at 15% 20%, rgba(255, 255, 255, .25), transparent 40%), linear-gradient(135deg, var(--c), var(--c-d)); }
#day > .day-top::after { content: ""; position: absolute; inset: auto 0 -1px 0; height: 18px; background: radial-gradient(circle at 10px -2px, transparent 12px, var(--paper) 12.5px) 0 0 / 20px 18px repeat-x; }
#day .day-top .date { display: inline-block; padding: 2px 12px 3px; border-radius: 99px; background: rgba(255, 255, 255, .92); color: var(--c-d); }
#day .day-top h2 { color: #fff; font-size: 1.9rem; margin-top: 6px; text-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
#day .day-top img { width: 96px; height: 90px; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .3)); animation: pd-bob 3.2s ease-in-out infinite; }
@keyframes pd-bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
#day .pic img { border-radius: 14px; }
#day .sec, #day .report { --s: #5d9a4b; --s2: #e2f0d8; position: relative; padding: 14px 16px 16px; border-radius: 18px; background: #fffdf7; border: 2px solid var(--s2); box-shadow: 0 4px 0 var(--s2); }
#day .sec + .sec { --s: #7b5cc4; --s2: #ebe3fa; }
#day .report { --s: #e0a12c; --s2: #fbefcf; }
#day .sec h3, #day .report h3 { display: flex; align-items: center; gap: 10px; font-family: var(--hand); font-weight: 400; font-size: 1.6rem; line-height: 1.15; color: var(--s); }
#day .sec h3::before, #day .report h3::before { content: "📖"; flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: var(--s); font-size: 1.3rem; transform: rotate(-6deg); box-shadow: 0 3px 0 rgba(0, 0, 0, .15); }
#day .sec + .sec h3::before { content: "📚"; transform: rotate(5deg); }
#day .report h3::before { content: "⭐"; }
#day .quote { border-radius: 12px; border-inline-start-width: 4px; }
#day .todo textarea, #day input { border-radius: 12px; }
#day .btn { border-radius: 14px; background: linear-gradient(135deg, #ef8a3c, #e0a12c); color: #fff; font-size: 1.1rem; padding: 12px 24px; box-shadow: 0 4px 0 #a8641c; }
#day .btn:hover { transform: translateY(1px); box-shadow: 0 3px 0 #a8641c; }
#day .done { border-radius: 16px; background: linear-gradient(135deg, #eaf7e8, #d9f0d4); }
#day .done strong::before { content: "🎉 "; }
.sumv { margin: 0 16px; display: grid; gap: 6px; justify-items: center; }
.sumv video { display: block; width: auto; max-width: 100%; max-height: 70vh; aspect-ratio: 9 / 16; border-radius: 16px; background: #000; box-shadow: 0 0 0 4px #fffaf0, 0 10px 24px rgba(42, 36, 51, .25); }
.sumv figcaption { font-family: var(--hand); font-size: 1.4rem; color: #c2566f; }
.cf { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { #day .day-top img { animation: none; } }
.done strong { font-family: var(--display); font-weight: var(--dw); font-size: 1.3rem; color: #2f6b3a; }
/* ===== Livelier entry, header and day tabs (2026-11-23): paper pop-up style ===== */
.paper { background: radial-gradient(circle at 12px 12px, rgba(201, 151, 63, .16) 2px, transparent 2.5px) 0 0 / 26px 26px, var(--paper); }
.head h1 { position: relative; display: inline-block; padding: 4px 26px 10px; color: var(--felt); text-shadow: none; transform: rotate(-1.5deg);
  background: linear-gradient(135deg, #ffd76a, var(--flame)); border-radius: 12px; box-shadow: 0 5px 0 #a8641c, 0 14px 30px rgba(0, 0, 0, .35); }
.head h1::before, .head h1::after { content: "✨"; position: absolute; top: -14px; font-size: 1.4rem; }
.head h1::before { inset-inline-start: -14px; } .head h1::after { inset-inline-end: -12px; top: auto; bottom: -10px; }
.head #intro { margin-top: 10px; }
.who { margin-top: 6px; padding: 6px 14px; border-radius: 99px; background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 var(--paper-2); }
.head .who b, .head .who span { color: var(--felt); }
.who .link { color: #b85d1c; }
#login { border-radius: 22px; overflow: hidden; padding: 0 22px 24px; border-bottom: 0; box-shadow: 0 6px 0 #b85d1c, 0 30px 70px rgba(0, 0, 0, .6);
  background: radial-gradient(circle at 12px 12px, rgba(201, 151, 63, .16) 2px, transparent 2.5px) 0 0 / 26px 26px, var(--paper); }
#login h2 { position: relative; margin: 0 -22px 6px; padding: 18px 22px 26px; color: #fff; font-size: 1.9rem; text-shadow: 0 3px 0 rgba(0, 0, 0, .18);
  background: radial-gradient(circle at 15% 20%, rgba(255, 255, 255, .25), transparent 40%), linear-gradient(135deg, #ef8a3c, #b85d1c); }
#login h2::before { content: "🔑 "; }
#login h2::after { content: ""; position: absolute; inset: auto 0 -1px 0; height: 18px; background: radial-gradient(circle at 10px -2px, transparent 12px, var(--paper) 12.5px) 0 0 / 20px 18px repeat-x; }
#login input { border-radius: 12px; }
#login .btn { border-radius: 14px; background: linear-gradient(135deg, #ef8a3c, #e0a12c); color: #fff; font-size: 1.1rem; padding: 12px 28px; box-shadow: 0 4px 0 #a8641c; }
.days { gap: 10px; padding: 10px 4px 14px; }
.days button { --c: #ef8a3c; position: relative; width: 88px; padding: 10px 4px 8px; border: 0; border-radius: 16px; color: var(--ink);
  background: radial-gradient(circle at 8px 8px, rgba(201, 151, 63, .16) 1.5px, transparent 2px) 0 0 / 16px 16px, var(--paper);
  border-top: 6px solid var(--c); box-shadow: 0 4px 0 var(--paper-2); transition: transform .2s; }
.days button:nth-child(odd) { transform: rotate(-2deg); }
.days button:nth-child(even) { transform: rotate(2deg); }
.days button:hover:not([disabled]) { transform: translateY(-3px); }
.days b { color: var(--c); }
.days small { color: #6d6252; }
.days button[aria-current="true"] { background: var(--c); border-top-color: var(--c); transform: translateY(-4px) scale(1.06); box-shadow: 0 6px 0 rgba(0, 0, 0, .25); }
.days button[aria-current="true"] b, .days button[aria-current="true"] small { color: #fff; }
.days button[disabled] { opacity: .5; filter: grayscale(.6); }
.days button .tick { position: absolute; top: -8px; inset-inline-start: -6px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #3f8a52; color: #fff; font-size: .8rem; box-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
footer::before { content: "🏮 "; }
.soon { text-align: center; color: var(--paper-2); }
footer { text-align: center; color: var(--dim); font-size: .85rem; }
</style>
</head>

<main>
  <div class="logos">
  <p class="campaign-logo"><img src="../assets/campaign-logo.webp" alt="אור וחיות נפשנו · מבצע הכנה לי״ט כסלו תשפ״ז"></p>
  <p class="school-logo"><img src="../assets/school-logo.webp" alt="שליחות ומצוינות, בית ספר חב״ד בנות לוד · רשת אהלי יוסף יצחק" width="640" height="296"></p>
  </div>
  <header class="head">
    <img src="../assets/lantern-on.png" alt="">

    <h1>הורים יקרים</h1>
    <p id="intro">כאן רואים בכל יום מה הבנות למדו, ומדווחים על ביצוע המשימה.</p>

  </header>

  <form class="card" id="login" hidden novalidate>
    <h2>כניסה</h2>
    <p>את קוד הכיתה קיבלתם מהמורה.</p>
    <label>קוד הכיתה<input id="code" inputmode="numeric" autocomplete="off" maxlength="6" required></label>
    <label>שם התלמידה<input id="name" autocomplete="given-name" maxlength="40" required></label>
    <button class="btn" id="go" type="submit">כניסה</button>
    <p class="msg" id="loginMsg" aria-live="polite"></p>
  </form>

  <section id="app" hidden>
    <nav class="days" id="days" aria-label="ימי שבוע ההכנה"></nav>
    <article class="card" id="day" aria-live="polite"></article>
  </section>

  <p class="soon" id="soon" hidden></p>
  <footer>בית הספר · חודש כסלו</footer>
</main>

      learn: 'לנשמה יש שלושה ״בגדים״: מחשבה, דיבור ומעשה. דרכם הנשמה מאירה החוצה. ובגד אפשר תמיד להחליף.',
      story: 'החסיד שהחליף בגדים', storyText: 'סוחר חסיד התבייש ללכת בבגדים חסידיים בנסיעות. הרבי עזר לו להבין שהבגדים החסידיים הם מי שהוא באמת.',
      talk: 'מתי קשה לך להראות מי את, ומה עוזר לך?',
      todo: { lines: ['איזה מעשה טוב עשיתי היום בכל אחד משלושת הלבושים?'], fields: ['מחשבה', 'דיבור', 'מעשה'] } },
    { date: '2026-11-26', day: 'יום חמישי', heb: 'ט״ז כסלו', img: 'pop-4.webp', pic: 'd4-pic.webp', theme: 'בעלת הבית על המחשבות',
      quote: '״ואפילו אם נופלים לו הרהורי תאוות ושאר מחשבות זרות בשעת העבודה בתורה או בתפלה בכוונה, אל ישית לב אליהן, אלא יסיח דעתו מהן כרגע.״', source: 'תניא, פרק כ״ח',
      learn: 'מחשבות מפריעות מגיעות לבד, גם בתפילה, וזה לא אומר שאנחנו לא טובות. לא מתווכחות איתן ולא נעצבות בגללן: מפנות מהן את הראש וחוזרות למה שעשינו.',
      story: 'בעל הבית', storyText: 'רבי זאב מז׳יטומיר לימד יהודי שבעל הבית מחליט מי נכנס לבית. כך גם אנחנו מחליטות אילו מחשבות ייכנסו לראש.',
      talk: 'איזו מחשבה מפריעה לך הכי הרבה, ומה תעשי כשהיא ״דופקת בדלת״?',
      todo: { lines: ['היום אני בעלת הבית על המחשבות שלי.', 'מחשבה מייאשת שהחלפתי במחשבה חיובית:'], fields: [''] } },
    { date: '2026-11-27', day: 'יום שישי', heb: 'י״ז כסלו', img: 'pop-5.webp', theme: 'קבלת עול',
      quote: '״והוא גם הוא מקבל עליו מלכותו להיות מלך עליו ולעבדו ולעשות רצונו בכל מיני עבודת עבד.״', source: 'תניא, פרק מ״א',
      learn: 'מקבלות את הקב״ה כמלך ועושות את רצונו גם כשקשה וגם כשלא מבינות הכול, כמו חייל נאמן.',
      story: 'שלושה מלכים ושלושה חיילים', storyText: 'שלושה מלכים בדקו של מי החיילים הנאמנים ביותר. רק החייל הרוסי לא שאל ״למה״, אלא ״לאיזה צד?״.',
      talk: 'מה הכי קשה לך לעשות בלי לשאול ״למה״?',
      todo: { lines: ['היום בקבלת עול עושה מה שאמא/אבא מבקשים ממני בפעם הראשונה'], fields: [''] } }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var me = null, done = [], cur = -1;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function today() {
    var t = new URLSearchParams(location.search).get('d');
    if (t && /^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
    var n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
  }
  function isOpen(d) { return today() >= d.date; }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  function save(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) {} }
  function localDone() { return (me && me.done) || []; }

  function check(code, name) {
    return fetch(API + '?code=' + encodeURIComponent(code) + '&name=' + encodeURIComponent(name)).then(function (r) { return r.json(); });
  }

  function showLogin() {
    $('login').hidden = false; $('app').hidden = true; $('who').hidden = true; $('soon').hidden = true;
    $('intro').hidden = false;
  }
  function showApp() {
    $('login').hidden = true; $('who').hidden = false; $('intro').hidden = true;
    $('whoName').textContent = me.name; $('whoCls').textContent = me.cls;
    if (!isOpen(DAYS[0])) {
      $('app').hidden = true; $('soon').hidden = false;
      $('soon').textContent = 'שבוע ההכנה מתחיל ביום ראשון, י״ב כסלו. מאותו יום יופיע כאן מה הבנות למדו.';
      return;
    }
    $('soon').hidden = true; $('app').hidden = false;
    if (cur < 0 || !isOpen(DAYS[cur])) { cur = 0; DAYS.forEach(function (d, i) { if (isOpen(d)) cur = i; }); }
    render();
  }

  var HUES = [['#e0645a', '#a93a35'], ['#ef8a3c', '#b85d1c'], ['#d9708f', '#a3435f'], ['#3f9a8a', '#226b5f'], ['#4a86cc', '#2a5a96'], ['#9064c8', '#5f3c94']];
  function render() {
    var nav = $('days'); nav.textContent = '';
    DAYS.forEach(function (d, i) {
      var b = document.createElement('button'); b.type = 'button';
      var open = isOpen(d), isDone = done.indexOf(i) >= 0;
      b.style.setProperty('--c', HUES[i][0]); b.disabled = !open; b.setAttribute('aria-current', i === cur ? 'true' : 'false');
      b.innerHTML = '<img src="../assets/' + d.img + '" alt=""><b>' + d.day + '</b><small>' + d.heb + (isDone ? ' <span class="tick">✓</span>' : '') + '</small>';
      b.setAttribute('aria-label', d.day + ', ' + d.heb + (open ? (isDone ? ', דווח' : '') : ', עוד לא נפתח'));
      b.addEventListener('click', function () { cur = i; render(); });
      nav.appendChild(b);
    });
    var d = DAYS[cur], isDone = done.indexOf(cur) >= 0;
    $('day').style.setProperty('--c', HUES[cur][0]); $('day').style.setProperty('--c-d', HUES[cur][1]);
    $('day').innerHTML =
      '<div class="day-top"><div><p class="date">' + d.day + ' · ' + d.heb + '</p><h2>' + esc(d.theme) + '</h2></div><img src="../assets/' + d.img + '" alt=""></div>' +
      (d.summary ? '<figure class="sumv"><video controls preload="metadata" playsinline poster="../assets/' + d.summaryPoster + '" src="../assets/' + d.summary + '"></video><figcaption>🎉 סיכום היום בבית הספר</figcaption></figure>' : '') +
      (d.pic ? '<figure class="pic"><img src="../assets/' + d.pic + '" alt="רגע מתוך סרטון הדילמה של היום" loading="lazy"><figcaption>רגע מתוך הדילמה של היום</figcaption></figure>' : '') +
      '<section class="sec"><h3>מה למדנו היום</h3><p class="quote">' + esc(d.quote) + '<small>(' + esc(d.source) + ')</small></p><p>' + esc(d.learn) + '</p></section>' +
      '<section class="sec"><h3>הסיפור: ' + esc(d.story) + '</h3><p>' + esc(d.storyText) + '</p></section>' +
      '<section class="report" aria-labelledby="repTitle">' + (isDone
        ? '<div class="done"><strong>תודה, הדיווח התקבל ✓</strong><span>המורה תראה שהמשימה בוצעה.</span></div>'
        : '<h3 id="repTitle">המשימה להיום:</h3><div class="todo">' + d.todo.lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') +
          d.todo.fields.map(function (f, k) { return f ? '<label>' + esc(f) + '<textarea class="ans" rows="2" maxlength="300" data-f="' + esc(f) + '"></textarea></label>' : '<textarea class="ans" rows="3" maxlength="300" aria-label="המשימה להיום"></textarea>'; }).join('') +
          '</div><button class="btn" id="send" type="button">המשימה בוצעה ✓</button><p class="msg" id="sendMsg" aria-live="polite"></p>') +
      '</section>';
    var send = $('send'); if (send) send.addEventListener('click', report);
  }

  // Confetti in the site's colours when a report is received.
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.createElement('canvas'); cv.className = 'cf'; document.body.appendChild(cv);
    var cx = cv.getContext('2d'), w = cv.width = innerWidth, h = cv.height = innerHeight, cols = ['#f0b23c', '#c9973f', '#1c234b', '#5d9a4b', '#7b5cc4', '#e76f51'], bits = [];
    for (var i = 0; i < 160; i++) bits.push({ x: w / 2 + (Math.random() - .5) * w * .4, y: h * .55, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, s: 6 + Math.random() * 7, c: cols[i % cols.length], t: 0 });
    (function step() {
      cx.clearRect(0, 0, w, h);
      bits = bits.filter(function (b) { return b.t < 150 && b.y < h + 40; });
      bits.forEach(function (b) { b.t++; b.vy += .45; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.globalAlpha = Math.min(1, (150 - b.t) / 30); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore(); });
      if (bits.length) requestAnimationFrame(step); else cv.remove();
    })();
  }

  function report() {
    var btn = $('send'), msg = $('sendMsg'), day = cur;
    btn.disabled = true; msg.textContent = '';
    var parts = [].map.call(document.querySelectorAll('#day .ans'), function (t) { var v = t.value.trim(); return v && t.dataset.f ? t.dataset.f + ': ' + v : v; }).filter(Boolean);
    if (!parts.length) { btn.disabled = false; msg.textContent = 'נא לכתוב את המשימה לפני השליחה.'; return; }
    var body = JSON.stringify({ kind: 'parent', code: me.code, name: me.name, d: day, note: parts.join(' | ') });
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        if (done.indexOf(day) < 0) done.push(day);
        me.done = done; save(me); render(); confetti();
      })
      .catch(function () { btn.disabled = false; msg.textContent = 'הדיווח לא נשלח. בדקו את החיבור לאינטרנט ונסו שוב.'; });
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value.trim(), name = $('name').value.replace(/\s+/g, ' ').trim(), msg = $('loginMsg'), go = $('go');
    if (!code || !name) { msg.textContent = 'נא למלא את קוד הכיתה ואת שם התלמידה.'; return; }
    go.disabled = true; msg.textContent = '';
    check(code, name).then(function (res) {
      go.disabled = false;
      if (!res.ok) { msg.textContent = 'קוד הכיתה לא נמצא. בדקו את הקוד שקיבלתם מהמורה.'; return; }
      me = { code: code, name: name, cls: res.cls }; done = res.done || []; me.done = done; save(me); showApp();
    }).catch(function () { go.disabled = false; msg.textContent = 'לא הצלחנו להתחבר. בדקו את החיבור לאינטרנט ונסו שוב.'; });
  });
  $('switch').addEventListener('click', function () { save(null); me = null; done = []; cur = -1; $('code').value = ''; $('name').value = ''; showLogin(); });

  me = load();
  if (me && me.code && me.name) {
    done = localDone(); showApp();
    // Refresh the reported days from the sheet, in case they reported from another phone.
    check(me.code, me.name).then(function (res) {
      if (!res.ok) { save(null); me = null; showLogin(); return; }
      done = res.done || []; me.done = done; me.cls = res.cls; save(me); if (!$('app').hidden) render(); else showApp();
    }).catch(function () {});
  } else showLogin();
})();
</script>
</body>
</html>
